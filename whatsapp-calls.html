<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shareek — Calls</title>
<style>:root{--navy:#0D1B2A;--cream:#E8E6DD;--line:#D3D1C7;--green:#2FA36B;--muted:#69717b;--amber:#8a6200}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--navy);font:15px/1.45 system-ui,sans-serif}header{height:64px;background:var(--navy);color:var(--cream);display:flex;align-items:center;gap:12px;padding:0 18px}.brand{font-size:19px;font-weight:750}.sub{color:#bcc4cb;font-size:13px;flex:1}button{font:inherit;cursor:pointer;border-radius:9px;padding:8px 12px}.ghost{background:transparent;border:1px solid #ffffff66;color:var(--cream)}.shell{max-width:950px;margin:auto;padding:20px}.card{background:#fff;border:1px solid #d8d6cc;border-radius:14px;padding:18px;margin-bottom:14px}.eyebrow{font-size:11px;font-weight:800;color:var(--muted);letter-spacing:.08em}.row{display:flex;gap:12px;align-items:center;justify-content:space-between}.status{display:inline-block;background:#fff3d6;color:var(--amber);border-radius:999px;padding:4px 9px;font-size:12px;font-weight:700}.controls{display:flex;gap:8px;margin-top:14px}.controls button{background:#f2f2ed;border:1px solid var(--line);color:var(--muted);cursor:not-allowed}.refresh{background:#fff;border:1px solid var(--line);color:var(--navy)}table{width:100%;border-collapse:collapse;margin-top:9px}th,td{text-align:left;padding:11px 8px;border-top:1px solid var(--line);font-size:13px}th{border:0;color:var(--muted);font-size:11px;text-transform:uppercase}.empty{padding:28px 8px;color:var(--muted);text-align:center}.error{background:#fff3d6;color:var(--amber);padding:12px;border-radius:9px}.login{max-width:420px;margin:15vh auto;background:#fff;border-radius:15px;padding:28px;text-align:center;color:var(--muted)}</style></head>
<body><main id="app"></main><script>
const SB='https://pxeiozmsfvmypcsqbcqv.supabase.co',API=SB+'/functions/v1/whatsapp-voice-calls',ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB4ZWlvem1zZnZteXBjc3FiY3F2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIwNDI1MTcsImV4cCI6MjA5NzYxODUxN30.s23PCgc_HuGRUSdN3hMNXBsdsavofLBIZj3Ppq5lP94';
let session=null,calls=[],error='';try{const handoff=new URLSearchParams(location.hash.slice(1)).get('shareek_session');if(handoff){session=JSON.parse(decodeURIComponent(handoff));history.replaceState(null,'',location.pathname)}}catch{}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const time=s=>s?new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Baghdad',dateStyle:'medium',timeStyle:'short'}).format(new Date(s)):'—';const duration=s=>s==null?'—':`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
async function load(){if(!session)return render();try{const r=await fetch(API,{method:'POST',headers:{apikey:ANON,Authorization:'Bearer '+session.access_token,'content-type':'application/json'},body:'{}'}),j=await r.json();if(!r.ok)throw Error(j.error||'Could not load calls');calls=j.calls||[];error=''}catch(e){calls=[];error=e.message}render()}
function render(){if(!session){app.innerHTML='<section class="login"><b>Shareek Calls</b><p>Open this workspace from the Shareek dashboard.</p></section>';return}app.innerHTML=`<header><div class="brand">Shareek Calls</div><span class="sub">WhatsApp Business call desk</span><button class="ghost" onclick="window.close()">Close</button></header><div class="shell"><div class="card"><div class="row"><div><div class="eyebrow">ACTIVE CALL</div><h2 style="margin:4px 0">No call in progress</h2><div style="color:var(--muted)">When PBX/SIP is connected, customer calls will ring here.</div></div><span class="status">Not live</span></div><div class="controls"><button disabled>Mute</button><button disabled>Speaker</button><button disabled>End call</button></div></div><div class="card"><div class="row"><div><div class="eyebrow">RECENT CALLS</div><h2 style="margin:4px 0">Live call history</h2></div><button class="refresh" onclick="load()">Refresh</button></div>${error?`<p class="error">${esc(error)}</p>`:calls.length?`<table><thead><tr><th>Customer</th><th>Channel</th><th>Direction</th><th>Started</th><th>Duration</th></tr></thead><tbody>${calls.map(c=>`<tr><td><b>${esc(c.customer_name||c.customer_phone||'Customer')}</b></td><td>${esc(c.channel_name||'—')}</td><td>${esc(c.direction||'—')}</td><td>${time(c.started_at)}</td><td>${duration(c.duration_seconds)}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">No calls yet. This list updates from the Shareek PBX as calls arrive.</div>'}</div></div>`}
render();if(session){load();setInterval(load,15000)}</script></body></html>
