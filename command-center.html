<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shareek Command Center</title><style>
:root{--navy:#0d1b2a;--ink:#182230;--cream:#f7f3eb;--line:#e4ded3;--green:#277a55;--amber:#b76d17;--red:#b83832;--muted:#647083}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif}.shell{max-width:1240px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:24px}.brand{font-weight:800;font-size:22px;color:var(--navy)}.brand small{display:block;font-weight:500;font-size:12px;color:var(--muted);margin-top:2px}.btn{border:0;background:var(--navy);color:#fff;padding:10px 14px;border-radius:8px;font-weight:700;cursor:pointer}.btn.secondary{background:#fff;color:var(--navy);border:1px solid var(--line)}.btn.green{background:var(--green)}.btn:disabled{opacity:.55;cursor:not-allowed}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:0 1px 2px #00000008}.metric span{color:var(--muted);font-size:12px}.metric b{font-size:28px;display:block;margin-top:5px}.toolbar{display:flex;justify-content:space-between;gap:12px;align-items:center;margin:22px 0 12px}.toolbar h2{margin:0;font-size:18px}.table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}.table th,.table td{padding:12px;text-align:left;border-bottom:1px solid var(--line);font-size:13px}.table th{background:#fbfaf7;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.04em}.table tr:last-child td{border-bottom:0}.table tr{cursor:pointer}.table tr:hover td{background:#fcfbf8}.pill{display:inline-block;border-radius:999px;padding:3px 9px;font-size:11px;font-weight:750;background:#edf0f3}.pill.green{background:#dff3e8;color:#176446}.pill.yellow{background:#fff0d5;color:#8d530e}.pill.red{background:#fde3e0;color:#9c2f2a}.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}.panel-title{margin:0 0 12px;font-size:16px}.list{margin:0;padding:0;list-style:none}.list li{padding:11px 0;border-bottom:1px solid var(--line);font-size:13px}.list li:last-child{border-bottom:0}.muted{color:var(--muted)}.modal{position:fixed;inset:0;background:#08111c99;display:grid;place-items:center;padding:16px;z-index:3}.modal-box{background:var(--cream);width:min(700px,100%);max-height:92vh;overflow:auto;border-radius:14px;padding:22px}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.modal-head h2{margin:0;font-size:19px}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.form .wide{grid-column:1/-1}label{font-size:12px;font-weight:700;color:#3d4755;display:grid;gap:5px}input,select,textarea{width:100%;border:1px solid #cfc7ba;background:#fff;border-radius:8px;padding:10px;font:inherit;color:var(--ink)}textarea{min-height:80px;resize:vertical}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.error{color:var(--red);font-size:13px;margin-top:10px}.login{width:min(400px,100%);margin:12vh auto;background:#fff;padding:28px;border:1px solid var(--line);border-radius:14px}.login h1{margin:0;color:var(--navy)}.login p{color:var(--muted);font-size:14px}.hidden{display:none}.check{display:flex;align-items:center;gap:9px}.check input{width:auto}.details-top{display:flex;justify-content:space-between;align-items:start;gap:12px}.details-top h3{margin:0}.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:18px}.add-row{display:flex;gap:8px;flex-wrap:wrap}.add-row input,.add-row select{width:auto;flex:1;min-width:120px}@media(max-width:760px){.grid,.two,.detail-grid,.form{grid-template-columns:1fr 1fr}.table th:nth-child(3),.table td:nth-child(3),.table th:nth-child(4),.table td:nth-child(4){display:none}}@media(max-width:480px){.grid,.two,.detail-grid,.form{grid-template-columns:1fr}.shell{padding:16px}.top{align-items:start}.table{display:block;overflow:auto}}
</style></head><body><div id="app"></div><script>
const SB='https://pxeiozmsfvmypcsqbcqv.supabase.co', ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB4ZWlvem1zZnZteXBjc3FiY3F2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIwNDI1MTcsImV4cCI6MjA5NzYxODUxN30.s23PCgc_HuGRUSdN3hMNXBsdsavofLBIZj3Ppq5lP94', API=SB+'/functions/v1/command-center';
let session=null,data=null,detail=null,error=''; const $=s=>document.querySelector(s); const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); const money=v=>v==null?'—':new Intl.NumberFormat('en-IQ',{maximumFractionDigits:0}).format(v)+' IQD'; const due=v=>v?new Date(v+'T00:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short'}):'—';
function pill(v){let c=['active','paid','green','done'].includes(v)?'green':['at_risk','trial','yellow','due','overdue','high','critical'].includes(v)?'yellow':['churned','lost','red'].includes(v)?'red':'';return `<span class="pill ${c}">${esc(String(v||'—').replaceAll('_',' '))}</span>`}
async function signIn(e){e.preventDefault();error='';render();let f=new FormData(e.target);let r=await fetch(SB+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:ANON,'content-type':'application/json'},body:JSON.stringify({email:f.get('email'),password:f.get('password')})});let j=await r.json();if(!r.ok){error=j.error_description||'Could not sign in';render();return}session=j;await load()}
async function call(payload){let r=await fetch(API,{method:'POST',headers:{apikey:ANON,Authorization:'Bearer '+session.access_token,'content-type':'application/json'},body:JSON.stringify(payload)});let j=await r.json().catch(()=>({error:'Unexpected server response'}));if(!r.ok)throw Error(j.error||'Request failed');return j}
async function load(){try{data=await call({action:'list'});detail=null;render()}catch(e){error=e.message;render()}}
function login(){return `<main class="login"><h1>Shareek</h1><p>Private Command Center · Master access only</p><form onsubmit="signIn(event)" class="form"><label class="wide">Email<input required name="email" type="email" autocomplete="email"></label><label class="wide">Password<input required name="password" type="password" autocomplete="current-password"></label><button class="btn wide">Sign in</button></form>${error?`<p class="error">${esc(error)}</p>`:''}</main>`}
function home(){let a=data.accounts||[],t=data.tasks||[],p=data.payments||[],o=data.opportunities||[],now=new Date().toISOString().slice(0,10),over=p.filter(x=>x.status!=='paid'&&x.due_date&&x.due_date<now),follow=o.filter(x=>x.stage!=='paid'&&x.stage!=='lost'&&x.next_follow_up_at&&x.next_follow_up_at.slice(0,10)<=now);return `<main class="shell"><header class="top"><div class="brand">Shareek <small>Private Command Center · ${new Date().toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'})}</small></div><div><button class="btn secondary" onclick="load()">Refresh</button> <button class="btn" onclick="openAccount()">+ New account</button></div></header><section class="grid"><div class="card metric"><span>Active clients</span><b>${a.filter(x=>x.status==='active'||x.status==='at_risk').length}</b></div><div class="card metric"><span>Money due / overdue</span><b>${p.filter(x=>x.status!=='paid').length}</b></div><div class="card metric"><span>Clients at risk</span><b>${a.filter(x=>x.health==='red'||x.status==='at_risk').length}</b></div><div class="card metric"><span>Important actions today</span><b>${t.filter(x=>x.priority==='high'||x.priority==='critical').length+follow.length}</b></div></section><div class="toolbar"><h2>Accounts</h2><span class="muted">Click an account to open its complete record</span></div><table class="table"><thead><tr><th>Business</th><th>Status</th><th>Health</th><th>Next action</th><th>Monthly value</th></tr></thead><tbody>${a.length?a.map(x=>`<tr onclick="openDetail('${x.id}')"><td><b>${esc(x.business_name)}</b><br><span class="muted">${esc(x.city||x.sector||'No sector or city yet')}</span></td><td>${pill(x.status)}</td><td>${pill(x.health)}</td><td>${esc(x.next_action||'—')}<br><span class="muted">${due(x.next_action_due)}</span></td><td>${money(x.monthly_price_iqd)}</td></tr>`).join(''):`<tr><td colspan="5" class="muted">No accounts yet. Add the first prospect or client.</td></tr>`}</tbody></table><section class="two" style="margin-top:16px"><div class="card"><h3 class="panel-title">Follow up now</h3><ul class="list">${follow.length?follow.map(x=>`<li><b>${esc(a.find(y=>y.id===x.account_id)?.business_name||'Unknown account')}</b><br><span class="muted">${esc(x.stage)} · ${new Date(x.next_follow_up_at).toLocaleString('en-GB')}</span></li>`).join(''):'<li class="muted">Nothing due right now.</li>'}</ul></div><div class="card"><h3 class="panel-title">Payment risk</h3><ul class="list">${over.length?over.map(x=>`<li><b>${esc(a.find(y=>y.id===x.account_id)?.business_name||'Unknown account')}</b> · ${money(x.amount_iqd)}<br><span class="muted">Due ${due(x.due_date)}</span></li>`).join(''):'<li class="muted">No overdue payments.</li>'}</ul></div></section><section class="card" style="margin-top:16px"><h3 class="panel-title">Open internal work</h3><ul class="list">${t.length?t.slice(0,8).map(x=>`<li>${pill(x.priority)} <b>${esc(x.title)}</b><span class="muted"> · ${esc(a.find(y=>y.id===x.account_id)?.business_name||'Shareek internal')} · due ${due(x.due_date)}</span></li>`).join(''):'<li class="muted">No open tasks.</li>'}</ul></section></main>`}
function render(){document.querySelector('#app').innerHTML=!session?login():detail?detailView():home()}
async function openDetail(id){try{detail=await call({action:'account_detail',account_id:id});render()}catch(e){alert(e.message)}}
function detailView(){let d=detail,a=d.account;return `<main class="shell"><header class="top"><div class="brand"><button class="btn secondary" onclick="detail=null;render()">← Accounts</button></div><button class="btn secondary" onclick="openAccount()">Edit account</button></header><section class="card"><div class="details-top"><div><h3>${esc(a.business_name)}</h3><p class="muted">${esc(a.sector||'No sector')} · ${esc(a.city||'No city')} · ${esc(a.primary_contact_name||'No contact')}</p></div><div>${pill(a.status)} ${pill(a.health)}</div></div><p><b>Next action:</b> ${esc(a.next_action||'None')} <span class="muted">${due(a.next_action_due)}</span></p><p class="muted">${esc(a.notes||'No notes yet.')}</p></section><section class="detail-grid"><div class="card"><h3 class="panel-title">Onboarding</h3><ul class="list">${d.onboarding.map(x=>`<li class="check"><input type="checkbox" ${x.completed_at?'checked':''} onchange="toggleOnboarding('${x.id}',this.checked)"><span>${esc(x.label)}</span></li>`).join('')||'<li class="muted">No checklist yet.</li>'}</ul></div><div class="card"><h3 class="panel-title">Tasks</h3><ul class="list">${d.tasks.map(x=>`<li>${pill(x.priority)} <b>${esc(x.title)}</b>${x.status==='done'?'':' <button class="btn secondary" style="padding:4px 7px;float:right" onclick="taskDone(\''+x.id+'\')">Done</button>'}<br><span class="muted">${esc(x.owner||'Unassigned')} · due ${due(x.due_date)}</span></li>`).join('')||'<li class="muted">No tasks yet.</li>'}</ul><div class="add-row" style="margin-top:12px"><input id="task-title" placeholder="New task"><select id="task-priority"><option value="medium">Medium</option><option value="high">High</option><option value="critical">Critical</option><option value="low">Low</option></select><button class="btn" onclick="newTask()">Add</button></div></div><div class="card"><h3 class="panel-title">Payments</h3><ul class="list">${d.payments.map(x=>`<li>${pill(x.status)} <b>${money(x.amount_iqd)}</b><br><span class="muted">Due ${due(x.due_date)} · ${esc(x.payment_method||'No method')}</span></li>`).join('')||'<li class="muted">No payment entries yet.</li>'}</ul><div class="add-row" style="margin-top:12px"><input id="pay-amount" type="number" min="1" placeholder="Amount IQD"><input id="pay-due" type="date"><button class="btn" onclick="newPayment()">Add</button></div></div><div class="card"><h3 class="panel-title">Sales</h3><ul class="list">${d.opportunities.map(x=>`<li>${pill(x.stage)} <b>${money(x.expected_monthly_value_iqd)}</b><br><span class="muted">Follow up ${x.next_follow_up_at?new Date(x.next_follow_up_at).toLocaleString('en-GB'):'—'}</span></li>`).join('')||'<li class="muted">No sales opportunity yet.</li>'}</ul><div class="add-row" style="margin-top:12px"><select id="sale-stage"><option value="lead">Lead</option><option value="qualified">Qualified</option><option value="demo">Demo</option><option value="trial">Trial</option><option value="paid">Paid</option><option value="lost">Lost</option></select><input id="sale-value" type="number" min="0" placeholder="Monthly IQD"><input id="sale-follow" type="datetime-local"><button class="btn" onclick="newOpportunity()">Add</button></div></div></section></main>`}
function openAccount(){let a=detail?.account||{};document.body.insertAdjacentHTML('beforeend',`<div class="modal" id="modal"><div class="modal-box"><div class="modal-head"><h2>${a.id?'Edit':'New'} account</h2><button class="btn secondary" onclick="closeModal()">Close</button></div><form onsubmit="saveAccount(event)" class="form"><label>Business name<input required name="business_name" value="${esc(a.business_name||'')}"></label><label>Status<select name="status">${['prospect','trial','active','at_risk','paused','churned'].map(x=>`<option ${a.status===x?'selected':''}>${x}</option>`).join('')}</select></label><label>Sector<input name="sector" value="${esc(a.sector||'')}"></label><label>City<input name="city" value="${esc(a.city||'')}"></label><label>Contact name<input name="primary_contact_name" value="${esc(a.primary_contact_name||'')}"></label><label>Contact phone<input name="primary_contact_phone" value="${esc(a.primary_contact_phone||'')}"></label><label>Package<input name="package_name" value="${esc(a.package_name||'')}"></label><label>Monthly price (IQD)<input type="number" min="0" name="monthly_price_iqd" value="${esc(a.monthly_price_iqd||'')}"></label><label>Health<select name="health">${['green','yellow','red'].map(x=>`<option ${a.health===x?'selected':''}>${x}</option>`).join('')}</select></label><label>Next action due<input type="date" name="next_action_due" value="${esc(a.next_action_due||'')}"></label><label class="wide">Next action<input name="next_action" value="${esc(a.next_action||'')}"></label><label class="wide">Notes<textarea name="notes">${esc(a.notes||'')}</textarea></label><div class="actions wide"><button class="btn secondary" type="button" onclick="closeModal()">Cancel</button><button class="btn green">Save account</button></div></form></div></div>`)}function closeModal(){$('#modal')?.remove()}
async function saveAccount(e){e.preventDefault();let f=Object.fromEntries(new FormData(e.target));try{let j=await call({action:'account_upsert',account_id:detail?.account.id,...f});closeModal();if(detail)await openDetail(j.account_id);else await load()}catch(x){alert(x.message)}}async function toggleOnboarding(id,completed){try{await call({action:'toggle_onboarding',account_id:detail.account.id,item_id:id,completed});await openDetail(detail.account.id)}catch(e){alert(e.message)}}async function newTask(){let title=$('#task-title').value.trim();if(!title)return;try{await call({action:'task_create',account_id:detail.account.id,title,priority:$('#task-priority').value});await openDetail(detail.account.id)}catch(e){alert(e.message)}}async function taskDone(id){try{await call({action:'task_done',account_id:detail.account.id,task_id:id});await openDetail(detail.account.id)}catch(e){alert(e.message)}}async function newOpportunity(){let expected_monthly_value_iqd=$('#sale-value').value,stage=$('#sale-stage').value,next_follow_up_at=$('#sale-follow').value;if(!expected_monthly_value_iqd)return;try{await call({action:'opportunity_create',account_id:detail.account.id,expected_monthly_value_iqd,stage,next_follow_up_at});await openDetail(detail.account.id)}catch(e){alert(e.message)}}async function newPayment(){let amount_iqd=$('#pay-amount').value,due_date=$('#pay-due').value;if(!amount_iqd)return;try{await call({action:'payment_create',account_id:detail.account.id,amount_iqd,due_date});await openDetail(detail.account.id)}catch(e){alert(e.message)}}
render();
</script></body></html>
