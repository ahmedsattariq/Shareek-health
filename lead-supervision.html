<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shareek — Lead Supervision</title>
<style>:root{--navy:#0d1b2a;--cream:#e8e6dd;--green:#2fa36b;--line:#d3d1c7;--red:#b63e30;--muted:#5a6e82}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--navy);font:14px system-ui,sans-serif}.top{background:var(--navy);color:var(--cream);padding:16px max(18px,calc((100% - 1200px)/2));display:flex;align-items:center;gap:12px}.brand{font-weight:800;font-size:20px}.brand i{color:var(--green);font-style:normal}.sub{color:#bdc7d0;font-size:12px;flex:1}.wrap{max-width:1200px;margin:auto;padding:20px}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.card,.panel{background:#fff;border-radius:14px;box-shadow:0 2px 10px #0d1b2a14;padding:16px}.label{color:var(--muted);font-size:12px}.number{font-size:28px;font-weight:800;margin-top:5px}.panel{margin-top:16px;overflow:auto}h2{font-size:16px;margin:0 0 12px}table{border-collapse:collapse;width:100%;min-width:720px}th,td{text-align:left;padding:10px;border-bottom:1px solid var(--line);font-size:12px}th{color:var(--muted)}.bad{color:var(--red);font-weight:800}.ok{color:#167143;font-weight:800}.pill{border-radius:999px;padding:3px 8px;background:#e6ecf5;color:#274b7a;font-size:11px;font-weight:700}.refresh{border:0;border-radius:8px;background:var(--green);color:#fff;padding:8px 12px;font-weight:700;cursor:pointer}.error{color:var(--red)}.login{max-width:360px;margin:100px auto;background:#fff;padding:24px;border-radius:14px}.login input{width:100%;padding:10px;margin:6px 0;border:1px solid var(--line);border-radius:8px}@media(max-width:760px){.grid{grid-template-columns:repeat(2,1fr)}.wrap{padding:10px}.sub{display:none}}</style>
<main id="app"></main><script>
const SB="https://pxeiozmsfvmypcsqbcqv.supabase.co",API=SB+"/functions/v1/leads",ANON="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB4ZWlvem1zZnZteXBjcXFiY3F2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIwNDI1MTcsImV4cCI6MjA5NzYxODUxN30.s23PCgc_HuGRUSd3hMNXBsdsavofLBIZj3Ppq5lP94";let session=null,data=null;try{const h=new URLSearchParams(location.hash.slice(1)).get("shareek_session");if(h){session=JSON.parse(decodeURIComponent(h));history.replaceState(null,"",location.pathname)}}catch{}const app=document.querySelector("#app"),esc=s=>String(s??"").replace(/[&<>\"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
async function api(body){const r=await fetch(API,{method:"POST",headers:{apikey:ANON,authorization:"Bearer "+session.access_token,"content-type":"application/json"},body:JSON.stringify(body)}),j=await r.json();if(!r.ok)throw Error(j.error||"Request failed");return j}function login(msg=""){app.innerHTML=`<section class="login"><h1>Shareek <i>Supervision</i></h1><p>Open this page from the Shareek dashboard.</p><p class="error">${esc(msg)}</p></section>`}async function load(){try{data=await api({action:"supervision",call_center_code:data?.call_center_code});render()}catch(e){login(e.message)}}function leadRow(l){const due=l.follow_up_at&&new Date(l.follow_up_at)<new Date();return `<tr><td><b>${esc(l.customer_name||l.phone_number||"Unknown")}</b><br><span class="label">${esc(l.phone_number||"")}</span></td><td><span class="pill">${esc(l.status)}</span></td><td>${esc(l.assigned_to||"Unassigned")}</td><td class="${due?"bad":""}">${l.follow_up_at?new Date(l.follow_up_at).toLocaleString():"—"}</td><td>${esc(l.next_action||"Needs review")}</td></tr>`}function render(){if(!data)return login();const s=data.summary||{},employees=data.employees||[],attention=data.attention_leads||[];app.innerHTML=`<header class="top"><div class="brand">Shareek <i>Supervision</i></div><span class="sub">Human-agent lead control · no AI analysis</span><button class="refresh" onclick="load()">Refresh</button></header><main class="wrap"><section class="grid"><div class="card"><div class="label">All leads</div><div class="number">${s.total||0}</div></div><div class="card"><div class="label">Unassigned</div><div class="number bad">${s.unassigned||0}</div></div><div class="card"><div class="label">Overdue follow-ups</div><div class="number bad">${s.overdue_follow_ups||0}</div></div><div class="card"><div class="label">No status update</div><div class="number bad">${s.untouched||0}</div></div><div class="card"><div class="label">Won / Lost</div><div class="number ok">${s.won||0} / ${s.lost||0}</div></div></section><section class="panel"><h2>Employee supervision</h2><table><thead><tr><th>Employee</th><th>Assigned</th><th>New</th><th>Overdue</th><th>No status update</th><th>Won</th><th>Lost</th></tr></thead><tbody>${employees.map(e=>`<tr><td><b>${esc(e.email||e.role)}</b></td><td>${e.assigned}</td><td>${e.new}</td><td class="${e.overdue?"bad":""}">${e.overdue}</td><td class="${e.untouched?"bad":""}">${e.untouched}</td><td class="ok">${e.won}</td><td>${e.lost}</td></tr>`).join("")||"<tr><td colspan=7>No active employees.</td></tr>"}</tbody></table></section><section class="panel"><h2>Needs attention now</h2><table><thead><tr><th>Lead</th><th>Status</th><th>Owner</th><th>Follow-up</th><th>Next action</th></tr></thead><tbody>${attention.map(leadRow).join("")||"<tr><td colspan=5>Nothing needs attention.</td></tr>"}</tbody></table></section></main>`}if(session)load();else login();setInterval(()=>session&&load(),30000);
</script></html>
