<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Shareek — WhatsApp Inbox</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--navy:#0D1B2A;--cream:#E8E6DD;--line:#D3D1C7;--green:#2FA36B;--red:#D64545;--amber:#E0A100;--muted:#69717b}
    *{box-sizing:border-box} body{margin:0;background:var(--cream);color:var(--navy);font-family:Cairo,Arial,sans-serif}
    button,input,select,textarea{font:inherit} button{cursor:pointer}.hidden{display:none!important}
    .login-shell{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% 12%,#f8f7f2 0,#e8e6dd 52%,#dedbd1 100%)}
    .login{width:min(440px,100%);background:#fff;border:1px solid #0d1b2a12;border-radius:20px;padding:34px;box-shadow:0 18px 55px #0d1b2a20;text-align:center}
    .login-brand{display:flex;justify-content:center;margin-bottom:12px}.login-mark{width:58px;height:72px;display:block}.logo{font-size:25px;font-weight:700}.logo i{font-style:normal;color:var(--green)}
    .login h1{font-size:23px;margin:0}.login-helper{font-size:13px;color:var(--muted);line-height:1.8;margin:10px 0 18px}.login-field{display:grid;gap:7px;margin-top:13px;text-align:right;font-size:13px;font-weight:700}.login-field small{font-weight:400;color:var(--muted)}
    input,select,textarea{border:1px solid var(--line);border-radius:10px;padding:11px;width:100%;background:#fff;color:var(--navy)}.login input{text-align:right}.login input[dir=ltr]{text-align:left}
    input:focus,select:focus,textarea:focus{outline:3px solid #2fa36b22;border-color:var(--green)}
    .primary{background:var(--green);color:#fff;border:0;border-radius:10px;padding:11px 15px;font-weight:700}.login .primary{width:100%;margin-top:18px}.primary:disabled{opacity:.58;cursor:wait}
    .login-link{display:block;margin:13px auto 0;border:0;background:transparent;color:#26714e;font-size:13px}.login-link:disabled{color:var(--muted);cursor:not-allowed}.error{min-height:22px;color:var(--red);font-size:12px;margin-top:10px}.success{color:#26714e}.privacy{display:block;color:var(--muted);font-size:11px;margin-top:18px;text-decoration:none}.otp-input{font-size:25px!important;font-weight:700;letter-spacing:8px;text-align:center!important}.login-actions{display:flex;justify-content:center;gap:4px;flex-wrap:wrap}.login-actions .login-link{margin:13px 4px 0}
    header{height:66px;background:var(--navy);color:var(--cream);display:flex;align-items:center;padding:0 18px;gap:13px}.head-title{font-weight:700;font-size:18px}.head-sub{color:#bfc7cf;font-size:12px;flex:1}.ghost{color:var(--cream);border:1px solid #ffffff55;background:transparent;border-radius:8px;padding:7px 12px}
    .shell{max-width:1440px;margin:auto;padding:15px}.notice{background:#fff5d6;border:1px solid #ecd48a;color:#715708;border-radius:10px;padding:10px 12px;font-size:12px;margin-bottom:12px}
    .toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}.tabs{display:flex;gap:6px;flex:1;overflow:auto}.tab{white-space:nowrap;border:1px solid var(--line);background:#fff;color:var(--navy);border-radius:999px;padding:7px 12px;font-size:12px}.tab.active{background:var(--navy);border-color:var(--navy);color:#fff}.badge{background:var(--red);color:#fff;border-radius:999px;padding:0 6px;font-size:10px;margin-right:4px}.refresh{background:#fff;color:var(--navy);border:1px solid var(--line);border-radius:9px;padding:8px 13px}
    .workspace{height:calc(100vh - 158px);min-height:520px;display:grid;grid-template-columns:350px minmax(0,1fr) 250px;background:#fff;border-radius:15px;overflow:hidden;box-shadow:0 2px 10px #0d1b2a16}.list{border-left:1px solid var(--line);overflow:auto}.empty{padding:35px 18px;text-align:center;color:var(--muted);font-size:13px}.thread{padding:14px 15px;border-bottom:1px solid var(--line);cursor:pointer}.thread:hover,.thread.selected{background:#f5faf7}.thread.overdue{border-right:4px solid var(--red)}.row{display:flex;justify-content:space-between;gap:8px;align-items:center}.name{font-weight:700;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.preview{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:3px}.time{font-size:11px;color:var(--muted);white-space:nowrap}.state{font-size:10px;border-radius:999px;padding:2px 7px;background:#edf6f0;color:#167143}.state.overdue{background:#fce7e5;color:#af2929}.state.none{background:#eee;color:#666}
    .chat{display:flex;flex-direction:column;min-width:0}.chat-top{padding:13px 17px;border-bottom:1px solid var(--line);min-height:67px}.chat-name{font-weight:700}.chat-phone{font-size:11px;color:var(--muted);direction:ltr;text-align:right}.messages{flex:1;overflow:auto;padding:20px;background:#f8f8f5;display:flex;flex-direction:column;gap:10px}.bubble{width:fit-content;max-width:78%;padding:9px 12px;border-radius:12px;font-size:13px;white-space:pre-wrap;word-break:break-word;background:#fff;border:1px solid #eee}.bubble.out{align-self:flex-start;background:#dff3e7;border-color:#c8e9d4}.bubble.failed{background:#fce7e5;border-color:#e9b2ae}.meta{display:block;font-size:10px;color:var(--muted);margin-top:4px}.window-warning{padding:9px 12px;background:#fff5d6;color:#715708;font-size:12px;border-top:1px solid #ecd48a}.composer{padding:12px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:end}.composer textarea{min-height:46px;max-height:130px;resize:vertical}.composer .primary{min-width:75px}.composer textarea:disabled{background:#f1f1ef;color:var(--muted)}.composer .primary:disabled{opacity:.55;cursor:not-allowed}
    .details{border-right:1px solid var(--line);padding:16px;overflow:auto}.details h3{margin:0 0 14px;font-size:15px}.field{font-size:11px;color:var(--muted);margin-top:14px}.value{font-size:13px;margin-top:3px;word-break:break-word}.details select{font-size:12px;padding:8px}.close{margin-top:15px;width:100%;background:#fff;color:var(--red);border:1px solid #e9b2ae;border-radius:9px;padding:9px;font-weight:700}.loading{padding:28px;text-align:center;color:var(--muted)}
    @media(max-width:850px){.workspace{grid-template-columns:310px minmax(0,1fr)}.details{display:none}}@media(max-width:620px){.login-shell{padding:14px}.login{padding:26px 20px;border-radius:16px}header{padding:0 12px}.head-sub{display:none}.shell{padding:8px}.workspace{height:calc(100vh - 140px);display:block;position:relative}.list,.chat{height:100%}.chat{position:absolute;inset:0;background:#fff;z-index:2}.chat.no-selection{display:none}.back{display:inline-block}.details{display:none}.bubble{max-width:88%}.toolbar select{width:100%}}@media(min-width:621px){.back{display:none}}
  </style>
</head>
<body>
<main id="app"></main>
<script>
const SB="https://pxeiozmsfvmypcsqbcqv.supabase.co";
const API=SB+"/functions/v1/whatsapp-inbox";
const ANON="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB4ZWlvem1zZnZteXBjc3FiY3F2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIwNDI1MTcsImV4cCI6MjA5NzYxODUxN30.s23PCgc_HuGRUSdN3hMNXBsdsavofLBIZj3Ppq5lP94";
const AUTH_SESSION_KEY="shareek_inbox_session";
let session=null, profile=null, team=[], conversations=[], selected=null, messages=[], filter="unassigned", loading=false, loginMode="phone", pendingPhone="",resendAvailableAt=0,resendTimer=null;const requestedConversationId=new URLSearchParams(location.search).get("conversation");
function saveSession(value){if(!value?.access_token||!value?.refresh_token)throw new Error("لم يتم إنشاء جلسة صالحة.");session=value;sessionStorage.setItem(AUTH_SESSION_KEY,JSON.stringify(value))}
function clearSession(){session=null;profile=null;sessionStorage.removeItem(AUTH_SESSION_KEY)}
// Accept a signed handoff from the dashboard, or restore this tab's own verified session.
// Server-side profile authorization still runs before any Inbox data is returned.
try{const handoff=new URLSearchParams(location.hash.slice(1)).get("shareek_session");if(handoff){saveSession(JSON.parse(decodeURIComponent(handoff)));history.replaceState(null,"",location.pathname+location.search)}else{const stored=sessionStorage.getItem(AUTH_SESSION_KEY);if(stored)session=JSON.parse(stored)}}catch{clearSession()}
const app=document.getElementById("app");
const esc=s=>String(s??"").replace(/[&<>\"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
const time=v=>v?new Intl.DateTimeFormat("ar-IQ",{hour:"numeric",minute:"2-digit"}).format(new Date(v)):"";
const ago=v=>{const m=Math.max(0,Math.round((Date.now()-new Date(v).getTime())/60000));return m<1?"الآن":m<60?`منذ ${m} د`:`منذ ${Math.round(m/60)} س`};
async function authRequest(path,body,token=null){const headers={apikey:ANON,"content-type":"application/json"};if(token)headers.Authorization="Bearer "+token;const r=await fetch(SB+path,{method:"POST",headers,body:JSON.stringify(body)});let data={};try{data=await r.json()}catch{}if(!r.ok){const error=new Error(data.msg||data.message||data.error_description||data.error||"تعذّر تسجيل الدخول.");error.status=r.status;error.code=data.code||data.error_code||"";throw error}return data}
async function refreshSession(){if(!session?.refresh_token)return false;try{saveSession(await authRequest("/auth/v1/token?grant_type=refresh_token",{refresh_token:session.refresh_token}));return true}catch{clearSession();return false}}
async function api(body,retry=true){const r=await fetch(API,{method:"POST",headers:{apikey:ANON,Authorization:"Bearer "+session.access_token,"content-type":"application/json"},body:JSON.stringify(body)});if(r.status===401&&retry&&await refreshSession())return api(body,false);let data={};try{data=await r.json()}catch{}if(!r.ok)throw new Error(r.status===401?"انتهت الجلسة، سجّل الدخول مجدداً.":data.error||"حدث خطأ في الخادم");return data}
const loginLogo=`<svg class="login-mark" viewBox="0 0 34 42" aria-label="Shareek"><path fill="#111F2E" d="M6.25.75h21.5a5.5 5.5 0 0 1 5.5 5.5v29.5a5.5 5.5 0 0 1-5.5 5.5H6.25a5.5 5.5 0 0 1-5.5-5.5V6.25a5.5 5.5 0 0 1 5.5-5.5"/><path fill="none" stroke="#3A5068" stroke-width="1.5" d="M6.25.75h21.5a5.5 5.5 0 0 1 5.5 5.5v29.5a5.5 5.5 0 0 1-5.5 5.5H6.25a5.5 5.5 0 0 1-5.5-5.5V6.25a5.5 5.5 0 0 1 5.5-5.5"/><path fill="none" stroke="#D3D1C7" stroke-width="4.5" stroke-linecap="round" d="M11 34C24 34 24 22 17 22 10 22 10 10 23 10"/><circle fill="#D3D1C7" cx="23" cy="10" r="3.2"/><circle fill="#D3D1C7" cx="11" cy="34" r="3.2"/></svg>`;
function normalizePhone(value){let phone=String(value||"").trim().replace(/[\s()-]/g,"");if(phone.startsWith("00"))phone="+"+phone.slice(2);if(phone.startsWith("0"))phone="+964"+phone.slice(1);else if(phone.startsWith("964"))phone="+"+phone;return phone}
function login(error="",mode=loginMode){loginMode=mode;if(resendTimer&&mode!=="otp"){clearInterval(resendTimer);resendTimer=null}const content=mode==="otp"?`<h1>أدخل رمز التحقق</h1><p class="login-helper">أرسلنا رمز SMS إلى <b dir="ltr">${esc(pendingPhone)}</b>.</p><form onsubmit="verifyOtp(event)"><label class="login-field">رمز التحقق<input id="otp" class="otp-input" dir="ltr" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" required autofocus></label><button id="login-submit" class="primary" type="submit">تأكيد ودخول</button></form><div class="login-actions"><button id="resend" class="login-link" onclick="resendOtp()">إعادة إرسال الرمز</button><button class="login-link" onclick="login('', 'phone')">تغيير الرقم</button></div>`:mode==="email"?`<h1>تسجيل الدخول بالبريد</h1><p class="login-helper">للحسابات التي ما زالت تستخدم البريد وكلمة المرور.</p><form onsubmit="signInEmail(event)"><label class="login-field">البريد الإلكتروني<input id="email" type="email" dir="ltr" autocomplete="username" required autofocus></label><label class="login-field">كلمة المرور<input id="password" type="password" dir="ltr" autocomplete="current-password" required></label><button id="login-submit" class="primary" type="submit">دخول</button></form><button class="login-link" onclick="login('', 'phone')">الدخول برقم الهاتف</button>`:`<h1>دخول موظفي واتساب</h1><p class="login-helper">أدخل رقم الهاتف المسجّل في Shareek وسنرسل رمز دخول لمرة واحدة عبر SMS.</p><form onsubmit="sendOtp(event)"><label class="login-field">رقم الهاتف<input id="phone" type="tel" dir="ltr" inputmode="tel" autocomplete="tel" placeholder="0785 551 9656" required autofocus><small>يمكنك كتابة الرقم بصيغة 07… أو +964…</small></label><button id="login-submit" class="primary" type="submit">إرسال الرمز</button></form><button class="login-link" onclick="login('', 'email')">الدخول بالبريد وكلمة المرور</button>`;app.innerHTML=`<main class="login-shell"><section class="login"><div class="login-brand">${loginLogo}</div><div class="logo">Shareek <i>Inbox</i></div>${content}<div id="login-error" class="error" role="alert" aria-live="polite">${esc(error)}</div><a class="privacy" href="privacy-master.html">سياسة الخصوصية</a></section></main>`;if(mode==="otp")startResendTimer()}
function setLoginBusy(busy){const button=document.getElementById("login-submit");if(button){button.disabled=busy;button.textContent=busy?"يرجى الانتظار…":loginMode==="otp"?"تأكيد ودخول":loginMode==="email"?"دخول":"إرسال الرمز"}}
function showLoginError(message){const box=document.getElementById("login-error");if(box)box.textContent=message}
async function sendOtp(event){event?.preventDefault();const phone=normalizePhone(document.getElementById("phone")?.value);if(!/^\+9647\d{9}$/.test(phone))return showLoginError("أدخل رقم هاتف عراقي صحيحاً يبدأ بـ 07 أو +9647.");setLoginBusy(true);showLoginError("");try{await authRequest("/auth/v1/otp",{phone,create_user:false});pendingPhone=phone;resendAvailableAt=Date.now()+60000;login("","otp")}catch{showLoginError("تعذّر إرسال الرمز. تأكد أن الرقم مفعّل لموظف في Shareek أو حاول لاحقاً.");setLoginBusy(false)}}
async function resendOtp(){if(Date.now()<resendAvailableAt)return;try{await authRequest("/auth/v1/otp",{phone:pendingPhone,create_user:false});resendAvailableAt=Date.now()+60000;startResendTimer()}catch{showLoginError("تعذّر إعادة إرسال الرمز. حاول لاحقاً.")}}
function startResendTimer(){if(resendTimer)clearInterval(resendTimer);const update=()=>{const button=document.getElementById("resend");if(!button){clearInterval(resendTimer);resendTimer=null;return}const seconds=Math.max(0,Math.ceil((resendAvailableAt-Date.now())/1000));button.disabled=seconds>0;button.textContent=seconds>0?`إعادة الإرسال بعد ${seconds} ث`:`إعادة إرسال الرمز`;if(!seconds){clearInterval(resendTimer);resendTimer=null}};update();resendTimer=setInterval(update,1000)}
async function verifyOtp(event){event.preventDefault();const token=document.getElementById("otp")?.value.trim();if(!/^\d{6}$/.test(token))return showLoginError("أدخل رمز التحقق المكوّن من 6 أرقام.");setLoginBusy(true);showLoginError("");try{saveSession(await authRequest("/auth/v1/verify",{phone:pendingPhone,token,type:"sms"}));await start()}catch(e){clearSession();login(e.status===401||e.status===403?"رمز التحقق غير صحيح أو انتهت صلاحيته.":e.message,"otp")}}
async function signInEmail(event){event.preventDefault();const email=document.getElementById("email")?.value.trim(),password=document.getElementById("password")?.value;setLoginBusy(true);showLoginError("");try{saveSession(await authRequest("/auth/v1/token?grant_type=password",{email,password}));await start()}catch{clearSession();login("البريد الإلكتروني أو كلمة المرور غير صحيحة.","email")}}
async function start(){try{profile=await api({action:"profile"});if(!profile.clients.length){clearSession();return login("لا يوجد عميل مفعّل لهذا الحساب.")}if(profile.role==="agent")filter="mine";if(!profile.call_center_code)profile.call_center_code=profile.clients[0].call_center_code;await loadAll();if(requestedConversationId&&conversations.some(c=>c.id===requestedConversationId)){selected=conversations.find(c=>c.id===requestedConversationId);await loadMessages(requestedConversationId)}render()}catch(e){clearSession();login(e.message)}}
async function loadAll(){loading=true;render();const code=profile.call_center_code;try{const requests=[api({action:"inbox",call_center_code:code,assignee:filter==="mine"?"me":filter==="unassigned"?"unassigned":undefined,overdue:filter==="overdue"})];if(profile.role!=="agent")requests.push(api({action:"team",call_center_code:code}));const [inbox,people]=await Promise.all(requests);conversations=inbox.conversations;team=people?.users||[];if(selected&&!conversations.some(c=>c.id===selected.id)){selected=null;messages=[]}if(selected)await loadMessages(selected.id)}catch(e){alert(e.message)}finally{loading=false}}
async function loadMessages(id){const r=await api({action:"conversation",conversation_id:id});messages=r.messages}
function selectConversation(id){selected=conversations.find(c=>c.id===id);messages=[];render();loadMessages(id).then(render).catch(e=>alert(e.message))}
function status(c){if(!c.first_response_at&&new Date(c.response_due_at)<new Date())return ["متأخرة","overdue"];if(!c.assignee_user_id)return ["غير معيّنة","none"];return ["قيد المتابعة",""]}
function canSendFreeForm(c){const last=new Date(c?.last_customer_message_at).getTime();return Number.isFinite(last)&&Date.now()<last+24*60*60*1000}
function deliveryLabel(m){if(m.direction!=="outbound")return "العميل";return ({sent:"تم الإرسال",delivered:"تم التسليم",read:"تمت القراءة",failed:"فشل الإرسال"})[m.delivery_status]||"قيد الإرسال"}
function render(note=""){if(!session)return login();const active=conversations.filter(c=>!c.first_response_at&&new Date(c.response_due_at)<new Date()).length;const current=selected?conversations.find(c=>c.id===selected.id)||selected:null;const clientOptions=(profile.clients||[]).map(c=>`<option value="${esc(c.call_center_code)}" ${c.call_center_code===profile.call_center_code?"selected":""}>${esc(c.display_name||c.call_center_code)}</option>`).join("");const tabs=[["unassigned","غير معيّنة"],["mine","محادثاتي"],["overdue",`متأخرة <span class="badge">${active}</span>`],["all","الكل"]];app.innerHTML=`<header><div class="logo">Shareek <i>Inbox</i></div><span class="head-sub">صندوق واتساب المشترك</span>${profile.clients.length>1?`<select onchange="changeClient(this.value)" style="width:auto;padding:6px">${clientOptions}</select>`:""}<button class="ghost" onclick="logout()">خروج</button></header><div class="shell">${note?`<div class="notice">${esc(note)}</div>`:""}<div class="toolbar"><div class="tabs">${tabs.map(([id,label])=>`<button class="tab ${filter===id?"active":""}" onclick="setFilter('${id}')">${label}</button>`).join("")}</div><button class="refresh" onclick="refresh()">تحديث</button></div><section class="workspace"><aside class="list">${loading?`<div class="loading">جارٍ التحميل…</div>`:conversations.length?conversations.map(threadHtml).join(""):`<div class="empty">لا توجد محادثات في هذه القائمة.</div>`}</aside><section class="chat ${current?"":"no-selection"}">${current?chatHtml(current):`<div class="empty" style="margin:auto">اختر محادثة من القائمة لعرضها والرد عليها.</div>`}</section><aside class="details">${current?detailsHtml(current):`<div class="empty">اختر محادثة</div>`}</aside></section></div>`}
function threadHtml(c){const contact=Array.isArray(c.whatsapp_contacts)?c.whatsapp_contacts[0]:c.whatsapp_contacts||{};const [label,cls]=status(c);return `<article class="thread ${selected?.id===c.id?"selected":""} ${cls}" onclick="selectConversation('${c.id}')"><div class="row"><span class="name">${esc(contact.display_name||contact.phone_number||"عميل")}</span><span class="time">${ago(c.last_message_at)}</span></div><div class="preview">${c.assignee_user_id?"تم التعيين":"يحتاج إلى مسؤول"}</div><div class="row" style="margin-top:6px"><span class="state ${cls}">${label}</span><span class="time">${!c.first_response_at?`الرد قبل ${time(c.response_due_at)}`:"تم الرد"}</span></div></article>`}
function chatHtml(c){const contact=Array.isArray(c.whatsapp_contacts)?c.whatsapp_contacts[0]:c.whatsapp_contacts||{};const freeFormOpen=canSendFreeForm(c);return `<div class="chat-top"><button class="back refresh" onclick="selected=null;messages=[];render()">رجوع</button><div class="chat-name">${esc(contact.display_name||"عميل")}</div><div class="chat-phone">${esc(contact.phone_number||"")}</div></div><div class="messages">${messages.length?messages.map(m=>`<div class="bubble ${m.direction==='outbound'?"out":""} ${m.delivery_status==='failed'?"failed":""}">${esc(m.body||`[${m.message_type}]`)}<span class="meta">${m.direction==='outbound'?"أنت · ":""}${deliveryLabel(m)} · ${time(m.customer_sent_at||m.created_at)}</span></div>`).join(""):`<div class="empty">جارٍ تحميل الرسائل…</div>`}</div>${freeFormOpen?"":`<div class="window-warning">انتهت مهلة الرد المجاني في واتساب (24 ساعة). اطلب من العميل أن يرسل رسالة جديدة. رسائل القوالب ليست متاحة بعد.</div>`}<div class="composer"><textarea id="reply" ${freeFormOpen?"":"disabled"} placeholder="${freeFormOpen?"اكتب ردك هنا…":"لا يمكن إرسال رد حر حالياً"}" onkeydown="if(event.ctrlKey&&event.key==='Enter')sendReply()"></textarea><button class="primary" ${freeFormOpen?"":"disabled"} onclick="sendReply()">إرسال</button></div>`}
function detailsHtml(c){const contact=Array.isArray(c.whatsapp_contacts)?c.whatsapp_contacts[0]:c.whatsapp_contacts||{};const [label,cls]=status(c);const assignment=profile.role==="agent"?"":`<div class="field">المسؤول</div><select id="assignee" onchange="assign('${c.id}',this.value)"><option value="">اختر موظفاً…</option>${team.map(u=>`<option value="${u.user_id}" ${u.user_id===c.assignee_user_id?"selected":""}>${esc(u.email||u.role)}</option>`).join("")}</select>`;return `<h3>تفاصيل المحادثة</h3><div class="field">الحالة</div><div class="value"><span class="state ${cls}">${label}</span></div>${assignment}<div class="field">وقت أول رسالة</div><div class="value">${time(c.first_customer_message_at)}</div><div class="field">مهلة الرد</div><div class="value" style="color:${cls==='overdue'?'var(--red)':'inherit'}">${c.first_response_at?"تم الرد":time(c.response_due_at)}</div><div class="field">رقم العميل</div><div class="value" dir="ltr">${esc(contact.phone_number||"")}</div><button class="close" onclick="closeConversation('${c.id}')">إغلاق المحادثة</button>`}
async function setFilter(v){filter=v;selected=null;messages=[];await loadAll();render()}async function refresh(){await loadAll();render()}async function changeClient(v){profile.call_center_code=v;selected=null;messages=[];await loadAll();render()}async function assign(id,userId){if(!userId)return;try{await api({action:"assign",conversation_id:id,assignee_user_id:userId});await refresh()}catch(e){alert(e.message)}}async function closeConversation(id){if(!confirm("هل تريد إغلاق هذه المحادثة؟"))return;try{await api({action:"close",conversation_id:id});selected=null;messages=[];await refresh()}catch(e){alert(e.message)}}async function sendReply(){const box=document.getElementById("reply"),body=box?.value.trim();if(!body||!selected)return;box.disabled=true;try{await api({action:"reply",conversation_id:selected.id,body});box.value="";await refresh();await loadMessages(selected.id);render()}catch(e){alert(e.message);box.disabled=false}}async function logout(){const token=session?.access_token;clearSession();selected=null;messages=[];conversations=[];login();if(token)try{await authRequest("/auth/v1/logout",{},token)}catch{}}if(session)start();else login();setInterval(()=>{if(session)refresh()},30000);
</script>
</body>
</html>
